name: Prueba visual 3D de Cayey y Loíza
on:
  push:
    paths:
      - '.github/workflows/urban-visual-test.yml'
      - 'scripts/urban-visual-test.mjs'
      - 'src/app.html'
      - 'index.html'
      - 'js/polymap-detail.js'
      - 'js/polymap-urban.js'
      - 'sw.js'
      - 'version.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pfknr-urban-visual
  cancel-in-progress: true
jobs:
  urban-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar utilidades
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Probar PFKNR en pantalla de iPad
        env:
          PFKNR_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pfknr-http.log 2>&1 &
          sleep 2
          node scripts/urban-visual-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pfknr-urban-screenshots
          path: artifacts/urban/
          if-no-files-found: ignore
