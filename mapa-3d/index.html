<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puerto Rico 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mapa a pantalla completa; buscador flotante arriba-izquierda, ficha del municipio a la derecha (hoja inferior en teléfono). */
:root {
  --bg: #e4edec; --ink: #13262b; --muted: #55686c; --panel: rgba(248, 251, 250, .88); --line: rgba(19, 38, 43, .13);
  --ocean: #a6cad0; --fog: #c6dcde; --grid: #2c5a63;
  --land-1: #86a97a; --land-2: #b4bd7c; --land-3: #d3c28c; --land-4: #96b8a2; --land-5: #c4a87b;
  --side: #5c6b56; --edge: #f6f3e8; --accent: #df5430; --accent-ink: #ffffff;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #071419; --ink: #e2eded; --muted: #93a8ab; --panel: rgba(11, 28, 34, .86); --line: rgba(226, 237, 237, .13);
  --ocean: #0e2b34; --fog: #08191f; --grid: #64a8b2;
  --land-1: #5f8458; --land-2: #8a9356; --land-3: #a89662; --land-4: #5e8a73; --land-5: #9a7f53;
  --side: #26302a; --edge: #0b1d23; --accent: #ff7348; --accent-ink: #1a0b05; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #071419; --ink: #e2eded; --muted: #93a8ab; --panel: rgba(11, 28, 34, .86); --line: rgba(226, 237, 237, .13);
  --ocean: #0e2b34; --fog: #08191f; --grid: #64a8b2;
  --land-1: #5f8458; --land-2: #8a9356; --land-3: #a89662; --land-4: #5e8a73; --land-5: #9a7f53;
  --side: #26302a; --edge: #0b1d23; --accent: #ff7348; --accent-ink: #1a0b05; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.hovering { cursor: pointer; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; font: 600 11px/1 var(--f-body); color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg); will-change: transform; letter-spacing: .01em; }
.lbl.sel { font-size: 13px; font-weight: 700; }

.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .35); }

#finder { top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100% - 32px)); padding: 14px; display: grid; gap: 10px; z-index: 3; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: -.01em; }
.eyebrow { font: 500 11px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#q { width: 100%; box-sizing: border-box; font: 500 14px var(--f-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; outline: none; }
#q:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
#list { list-style: none; margin: 0; padding: 0; max-height: min(46vh, 380px); overflow-y: auto; display: grid; gap: 1px; }
#list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
#list li .code { font: 400 11px var(--f-mono); color: var(--muted); }
#list li:hover, #list li.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
#list li.cur { color: var(--accent); font-weight: 600; }
.count { font: 400 11px var(--f-mono); color: var(--muted); }

#info { top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); width: 300px; padding: 16px 16px 14px; z-index: 3; display: grid; gap: 12px; }
#info .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
#info h2 { margin: 4px 0 0; font: 700 26px/1.05 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
#close { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 16px; cursor: pointer; }
#close:hover { border-color: var(--accent); color: var(--accent); }
dl.stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
dl.stats div { min-width: 0; }
dl.stats dt { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
dl.stats dd { margin: 3px 0 0; font: 600 15px var(--f-body); font-variant-numeric: tabular-nums; }
dl.stats dd small { font-weight: 400; color: var(--muted); font-size: 12px; }
.nb-title { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
#nbs { display: flex; flex-wrap: wrap; gap: 6px; }
#nbs button { font: 500 12.5px var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
#nbs button:hover { border-color: var(--accent); color: var(--accent); }
#nbs .none { font-size: 13px; color: var(--muted); }

#tools { left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; padding: 6px; display: flex; gap: 4px; align-items: center; z-index: 2; flex-wrap: wrap; }
#tools button { font: 500 12.5px var(--f-body); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
#tools button:hover { border-color: var(--line); }
#tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#coord { font: 400 11.5px var(--f-mono); color: var(--muted); padding: 0 8px; font-variant-numeric: tabular-nums; min-width: 15ch; }

#tip { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 4; font: 600 12.5px var(--f-body);
  background: var(--ink); color: var(--bg); padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
button:focus-visible, #list li:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 13px var(--f-mono); color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 640px) {
  #finder { right: max(16px, env(safe-area-inset-right, 0px)); width: auto; padding: 10px 12px; gap: 8px; }
  .brand h1 { font-size: 17px; }
  #list { max-height: 34vh; }
  #info { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 48vh; overflow-y: auto; gap: 10px; }
  #info h2 { font-size: 22px; }
  #tools { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #app.has-sel #tools { display: none; }
  #coord { display: none; }
  #tip { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div id="app">
  <canvas id="scene" aria-label="Mapa 3D interactivo de Puerto Rico con sus 78 municipios"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="loading">Cargando mapa…</div>

  <header id="finder" class="panel">
    <div class="brand"><h1>Puerto Rico</h1><span class="eyebrow">78 municipios</span></div>
    <label for="q" class="sr">Buscar municipio</label>
    <input id="q" type="search" placeholder="Buscar municipio…" autocomplete="off" spellcheck="false">
    <ul id="list" role="listbox" aria-label="Municipios" hidden></ul>
  </header>

  <section id="info" class="panel" hidden aria-live="polite">
    <div class="head">
      <div><span class="eyebrow">Municipio · FIPS <span id="i-code"></span></span><h2 id="i-name"></h2></div>
      <button id="close" type="button" aria-label="Cerrar ficha">✕</button>
    </div>
    <dl class="stats">
      <div><dt>Área terrestre</dt><dd id="i-area"></dd></div>
      <div><dt>Colindancias</dt><dd id="i-nbn"></dd></div>
      <div><dt>Centro aprox.</dt><dd id="i-pos"></dd></div>
      <div><dt>Orden alfabético</dt><dd id="i-ord"></dd></div>
    </dl>
    <div class="nb-title">Colinda con</div>
    <div id="nbs"></div>
  </section>

  <div id="tools" class="panel">
    <button id="t-labels" type="button" aria-pressed="true">Nombres</button>
    <button id="t-spin" type="button" aria-pressed="false">Girar</button>
    <button id="t-reset" type="button">Vista inicial</button>
    <span id="coord" aria-live="off"></span>
  </div>
  <div id="tip" hidden></div>
</div>

<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('pr-data').textContent);
  const byId = new Map(DATA.map((m, i) => [m.id, i]));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Proyección: equirectangular local en km, centrada en la isla grande ----------
  const K = 111.32, LON0 = -66.45, LAT0 = 18.22, COS = Math.cos(LAT0 * Math.PI / 180);
  const proj = (lon, lat) => [(lon - LON0) * COS * K, (lat - LAT0) * K];
  const unproj = (x, y) => [x / (COS * K) + LON0, y / K + LAT0];
  const H = 1.6;           // grosor de cada municipio (km de escena)
  const LIFT_HOVER = 0.9, LIFT_SEL = 2.6;

  // ---------- Colores desde tokens CSS ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // Coloreo de grafo: municipios vecinos nunca comparten tono
  const colorIdx = new Array(DATA.length).fill(-1);
  DATA.map((m, i) => i).sort((a, b) => DATA[b].nb.length - DATA[a].nb.length).forEach(i => {
    const used = new Set(DATA[i].nb.map(id => colorIdx[byId.get(id)]));
    let c = 0; while (used.has(c)) c++; colorIdx[i] = c % 5;
  });

  // ---------- Escena ----------
  const canvas = document.getElementById('scene');
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffffff, 260, 700);
  const camera = new THREE.PerspectiveCamera(38, 1, 1, 3000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.44; controls.minDistance = 18; controls.maxDistance = 720;
  controls.screenSpacePanning = false; controls.autoRotateSpeed = 0.6;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445544, 0.75); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(-70, 140, 90); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 110, bottom: -110, near: 10, far: 400 });
  sun.shadow.bias = -0.0008;
  scene.add(sun);

  const oceanMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 });
  const ocean = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), oceanMat);
  ocean.rotation.x = -Math.PI / 2; ocean.receiveShadow = true; scene.add(ocean);

  // Retícula cada 0.25°
  const gridMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.22 });
  const gpts = [];
  for (let lat = 17.5; lat <= 19.0001; lat += 0.25) { const [x0, y] = proj(-68.25, lat), [x1] = proj(-64.75, lat); gpts.push(x0, 0.03, -y, x1, 0.03, -y); }
  for (let lon = -68.25; lon <= -64.7499; lon += 0.25) { const [x, y0] = proj(lon, 17.5), [, y1] = proj(lon, 19.0); gpts.push(x, 0.03, -y0, x, 0.03, -y1); }
  const gGeo = new THREE.BufferGeometry(); gGeo.setAttribute('position', new THREE.Float32BufferAttribute(gpts, 3));
  scene.add(new THREE.LineSegments(gGeo, gridMat));

  // ---------- Municipios ----------
  const sideMat = new THREE.MeshStandardMaterial({ roughness: 0.9 });
  const edgeMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.9 });
  const muni = DATA.map((m, i) => {
    const group = new THREE.Group();
    const shapes = m.polys.map(poly => {
      const ring = r => r.slice(0, -1).map(([lo, la]) => new THREE.Vector2(...proj(lo, la)));
      const sh = new THREE.Shape(ring(poly[0]));
      poly.slice(1).forEach(h => sh.holes.push(new THREE.Path(ring(h))));
      return sh;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: H, bevelEnabled: false, curveSegments: 1 });
    geo.rotateX(-Math.PI / 2);
    const topMat = new THREE.MeshStandardMaterial({ roughness: 0.82, metalness: 0 });
    const mesh = new THREE.Mesh(geo, [topMat, sideMat]);
    mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.idx = i;
    group.add(mesh);
    const lp = [];
    m.polys.forEach(poly => poly.forEach(r => {
      for (let k = 0; k < r.length - 1; k++) {
        const [ax, ay] = proj(...r[k]), [bx, by] = proj(...r[k + 1]);
        lp.push(ax, H + 0.02, -ay, bx, H + 0.02, -by);
      }
    }));
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
    group.add(new THREE.LineSegments(lg, edgeMat));
    const [lx, ly] = proj(...m.label);
    scene.add(group);
    return { m, i, group, mesh, topMat, lift: 0, target: 0, rise: reduceMotion ? 1 : 0,
      riseAt: reduceMotion ? 0 : 250 + (lx + 110) * 9, anchor: new THREE.Vector3(lx, H, -ly) };
  });
  const meshes = muni.map(o => o.mesh);

  // ---------- Tema ----------
  let palette = [];
  function applyTheme() {
    palette = [1, 2, 3, 4, 5].map(n => new THREE.Color(css('--land-' + n)));
    const oc = new THREE.Color(css('--ocean')), fog = new THREE.Color(css('--fog'));
    oceanMat.color.copy(oc); scene.fog.color.copy(fog); renderer.setClearColor(fog);
    gridMat.color.set(css('--grid')); sideMat.color.set(css('--side')); edgeMat.color.set(css('--edge'));
    const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
    hemi.intensity = dark ? 0.5 : 0.52; sun.intensity = dark ? 0.6 : 0.55;
    hemi.groundColor.set(dark ? 0x1a2620 : 0x556655);
    accent.set(css('--accent'));
    paint();
  }
  const accent = new THREE.Color();
  const tmp = new THREE.Color();
  function paint() {
    muni.forEach(o => {
      const base = palette[colorIdx[o.i]] || palette[0];
      if (o.i === selected) o.topMat.color.copy(accent);
      else if (o.i === hovered) o.topMat.color.copy(base).lerp(tmp.set(0xffffff), 0.28);
      else o.topMat.color.copy(base);
      o.topMat.emissive.set(o.i === selected ? accent : 0x000000);
      o.topMat.emissiveIntensity = o.i === selected ? 0.18 : 0;
    });
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });

  // ---------- Etiquetas HTML ----------
  const labelsEl = document.getElementById('labels');
  muni.forEach(o => {
    const d = document.createElement('div'); d.className = 'lbl'; d.textContent = o.m.name;
    labelsEl.appendChild(d); o.el = d; o.w = 0;
  });
  let showLabels = true;
  const order = muni.slice().sort((a, b) => b.m.areaKm2 - a.m.areaKm2);
  const v3 = new THREE.Vector3();
  function placeLabels(w, h) {
    if (!showLabels) { muni.forEach(o => { if (o.vis !== false) { o.el.style.visibility = 'hidden'; o.vis = false; } }); return; }
    const taken = [];
    const list = order.slice().sort((a, b) => (b.i === selected) - (a.i === selected) || (b.i === hovered) - (a.i === hovered));
    for (const o of list) {
      if (!o.w) o.w = o.el.offsetWidth || o.m.name.length * 6.5;
      v3.copy(o.anchor); v3.y = (H + o.lift) * o.rise + 0.4; v3.project(camera);
      let ok = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05 && o.rise > 0.95;
      const x = (v3.x + 1) / 2 * w, y = (1 - v3.y) / 2 * h;
      const r = { x0: x - o.w / 2 - 3, x1: x + o.w / 2 + 3, y0: y - 9, y1: y + 9 };
      if (ok) for (const t of taken) if (r.x0 < t.x1 && r.x1 > t.x0 && r.y0 < t.y1 && r.y1 > t.y0) { ok = false; break; }
      if (ok) { taken.push(r); o.el.style.transform = `translate(${(x - o.w / 2).toFixed(1)}px,${(y - 6).toFixed(1)}px)`; }
      if (o.vis !== ok) { o.el.style.visibility = ok ? 'visible' : 'hidden'; o.vis = ok; }
      o.el.classList.toggle('sel', o.i === selected);
    }
  }

  // ---------- Cámara ----------
  let size = { w: 1, h: 1 };
  function homeView() {
    const aspect = size.w / size.h, halfW = 92, halfH = 40;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = Math.min(700, Math.max(halfH / t, halfW / (t * aspect)) * 1.12);
    const dir = new THREE.Vector3(0, 0.78, 0.63).normalize();
    return { target: new THREE.Vector3(0, 0, -2), pos: dir.multiplyScalar(d) };
  }
  let tween = null;
  function flyTo(target, pos, ms = 900) {
    if (reduceMotion) ms = 0;
    tween = { t0: performance.now(), ms, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos };
  }
  function flyToMuni(o) {
    const target = new THREE.Vector3(o.anchor.x, 0, o.anchor.z);
    const d = THREE.MathUtils.clamp(Math.sqrt(o.m.areaKm2) * 4.2, 48, 120) * Math.max(1, 0.85 * size.h / size.w);
    const dir = camera.position.clone().sub(controls.target).normalize();
    if (dir.y < 0.55) { dir.y = 0.55; dir.normalize(); }
    flyTo(target, target.clone().add(dir.multiplyScalar(d)));
  }
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // ---------- Selección y hover ----------
  let selected = -1, hovered = -1;
  const info = document.getElementById('info');
  const fmt = new Intl.NumberFormat('es-PR', { maximumFractionDigits: 1 });
  const fmtLL = ([lon, lat]) => `${lat.toFixed(2)}°N ${Math.abs(lon).toFixed(2)}°O`;
  function select(i, { fly = true } = {}) {
    if (i === selected && i !== -1) { if (fly) flyToMuni(muni[i]); return; }
    if (selected >= 0) muni[selected].target = 0;
    selected = i;
    app.classList.toggle('has-sel', i >= 0);
    if (i < 0) { info.hidden = true; paint(); renderList(); dispatch(null); return; }
    const o = muni[i], m = o.m;
    o.target = LIFT_SEL;
    document.getElementById('i-code').textContent = m.id;
    document.getElementById('i-name').textContent = m.name;
    document.getElementById('i-area').innerHTML = `${fmt.format(m.areaKm2)} km² <small>· ${fmt.format(m.areaKm2 / 2.58999)} mi²</small>`;
    document.getElementById('i-nbn').textContent = m.nb.length ? m.nb.length : 'Isla';
    document.getElementById('i-pos').textContent = fmtLL(m.label);
    document.getElementById('i-ord').textContent = `${i + 1} de ${DATA.length}`;
    const nbs = document.getElementById('nbs'); nbs.textContent = '';
    if (!m.nb.length) { const s = document.createElement('span'); s.className = 'none'; s.textContent = 'Isla municipio, sin colindancias terrestres.'; nbs.append(s); }
    m.nb.map(id => byId.get(id)).sort((a, b) => a - b).forEach(j => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = DATA[j].name;
      b.addEventListener('click', () => select(j));
      b.addEventListener('mouseenter', () => setHover(j)); b.addEventListener('mouseleave', () => setHover(-1));
      nbs.append(b);
    });
    info.hidden = false;
    paint(); renderList();
    if (fly) flyToMuni(o);
    dispatch(m);
  }
  function dispatch(m) {
    window.dispatchEvent(new CustomEvent('municipio:select', { detail: m ? { id: m.id, name: m.name } : null }));
  }
  function setHover(i) {
    if (i === hovered) return;
    if (hovered >= 0 && hovered !== selected) muni[hovered].target = 0;
    hovered = i;
    if (i >= 0 && i !== selected) muni[i].target = LIFT_HOVER;
    canvas.classList.toggle('hovering', i >= 0);
    paint();
  }

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const tip = document.getElementById('tip'), coord = document.getElementById('coord');
  const oceanPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const h = ray.intersectObjects(meshes, false)[0];
    return { idx: h ? h.object.userData.idx : -1, r };
  }
  let down = null;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, type: e.pointerType }; });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const { idx, r } = pick(e);
    setHover(down ? hovered : idx);
    if (idx >= 0 && !down) {
      tip.hidden = false; tip.textContent = DATA[idx].name;
      tip.style.transform = `translate(${e.clientX - r.left + 14}px,${e.clientY - r.top + 14}px)`;
    } else tip.hidden = true;
    if (ray.ray.intersectPlane(oceanPlane, hit)) coord.textContent = fmtLL(unproj(hit.x, -hit.z));
  });
  canvas.addEventListener('pointerleave', () => { setHover(-1); tip.hidden = true; });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 6) return;
    const { idx } = pick(e);
    if (idx >= 0) select(idx); else if (selected >= 0) select(-1);
  });
  controls.addEventListener('start', () => { tween = null; });

  // ---------- Buscador ----------
  const q = document.getElementById('q'), listEl = document.getElementById('list');
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let matches = [], active = 0;
  function renderList() {
    const s = norm(q.value.trim());
    const open = document.activeElement === q || s.length > 0;
    matches = DATA.map((m, i) => i).filter(i => !s || norm(DATA[i].name).includes(s));
    listEl.hidden = !open;
    if (!open) return;
    active = Math.min(active, Math.max(0, matches.length - 1));
    listEl.textContent = '';
    if (!matches.length) { const li = document.createElement('li'); li.textContent = 'Ningún municipio coincide'; li.style.cursor = 'default'; listEl.append(li); return; }
    matches.forEach((i, k) => {
      const li = document.createElement('li'); li.setAttribute('role', 'option'); li.id = 'opt-' + DATA[i].id;
      if (k === active && s) li.classList.add('active');
      if (i === selected) li.classList.add('cur');
      li.innerHTML = `<span></span><span class="code">${DATA[i].id}</span>`; li.firstChild.textContent = DATA[i].name;
      li.addEventListener('mousedown', ev => { ev.preventDefault(); choose(i); });
      li.addEventListener('mouseenter', () => setHover(i)); li.addEventListener('mouseleave', () => setHover(-1));
      listEl.append(li);
    });
  }
  function choose(i) { select(i); q.value = ''; q.blur(); renderList(); }
  q.addEventListener('input', () => { active = 0; renderList(); });
  q.addEventListener('focus', renderList);
  q.addEventListener('blur', () => setTimeout(renderList, 0));
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { active = Math.min(active + 1, matches.length - 1); renderList(); e.preventDefault(); scrollActive(); }
    else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderList(); e.preventDefault(); scrollActive(); }
    else if (e.key === 'Enter' && matches.length) choose(matches[active]);
    else if (e.key === 'Escape') { q.value = ''; q.blur(); }
  });
  function scrollActive() { listEl.querySelector('.active')?.scrollIntoView({ block: 'nearest' }); }
  document.getElementById('close').addEventListener('click', () => select(-1));
  addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement !== q && selected >= 0) select(-1); });

  // ---------- Herramientas ----------
  const tLabels = document.getElementById('t-labels'), tSpin = document.getElementById('t-spin');
  tLabels.addEventListener('click', () => { showLabels = !showLabels; tLabels.setAttribute('aria-pressed', showLabels); });
  tSpin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; tSpin.setAttribute('aria-pressed', controls.autoRotate); });
  document.getElementById('t-reset').addEventListener('click', () => { select(-1, { fly: false }); const v = homeView(); flyTo(v.target, v.pos); });

  // ---------- Tamaño y bucle ----------
  function resize() {
    const w = app.clientWidth, h = app.clientHeight;
    if (!w || !h) return;
    size = { w, h };
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(app); resize();
  const v0 = homeView();
  controls.target.copy(v0.target);
  camera.position.copy(reduceMotion ? v0.pos : v0.pos.clone().multiplyScalar(1.35).add(new THREE.Vector3(-60, 40, 40)));
  if (!reduceMotion) flyTo(v0.target, v0.pos, 2200);
  applyTheme();

  const t0 = performance.now();
  function frame(now) {
    if (tween) {
      const k = tween.ms ? Math.min(1, (now - tween.t0) / tween.ms) : 1, e = ease(k);
      controls.target.lerpVectors(tween.ft, tween.tt, e); camera.position.lerpVectors(tween.fp, tween.tp, e);
      if (k >= 1) tween = null;
    }
    controls.update();
    for (const o of muni) {
      if (o.rise < 1 && now - t0 > o.riseAt) o.rise = Math.min(1, o.rise + 0.045);
      o.lift += (o.target - o.lift) * (reduceMotion ? 1 : 0.16);
      const r = ease(o.rise);
      o.group.position.y = o.lift * r - (1 - r) * (H + 0.5);
    }
    renderer.render(scene, camera);
    placeLabels(size.w, size.h);
    requestAnimationFrame(frame);
  }
  document.getElementById('loading').remove();
  requestAnimationFrame(frame);
  renderList();

  // API mínima para la app futura: PRMap.select('Ponce'), PRMap.reset(), PRMap.data
  window.PRMap = {
    data: DATA,
    select(key) { const i = typeof key === 'number' ? key : DATA.findIndex(m => m.id === key || norm(m.name) === norm(String(key))); if (i >= 0) select(i); return i; },
    clear() { select(-1); },
    reset() { document.getElementById('t-reset').click(); },
  };
})();
</script>
</body>
</html>
