<title>Puerto Rico 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: terreno a pantalla completa; buscador flotante arriba-izquierda, ficha a la derecha (hoja inferior en teléfono), herramientas abajo. */
:root {
  --bg: #dfe9ea; --ink: #13262b; --muted: #55686c; --panel: rgba(248, 251, 250, .9); --line: rgba(19, 38, 43, .14);
  --deep: #3f86a3; --shallow: #8fd3d6; --fog: #cfe2e4;
  --border: #ffffff; --island: #6f985f; --island-side: #c9b48a;
  --accent: #e4502a;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #061317; --ink: #e2eded; --muted: #93a8ab; --panel: rgba(9, 25, 30, .88); --line: rgba(226, 237, 237, .14);
  --deep: #0a2a38; --shallow: #1d6b74; --fog: #061419;
  --border: #f4efe2; --island: #557a4b; --island-side: #7d6c4e;
  --accent: #ff7247; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #061317; --ink: #e2eded; --muted: #93a8ab; --panel: rgba(9, 25, 30, .88); --line: rgba(226, 237, 237, .14);
  --deep: #0a2a38; --shallow: #1d6b74; --fog: #061419;
  --border: #f4efe2; --island: #557a4b; --island-side: #7d6c4e;
  --accent: #ff7247; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.hovering { cursor: pointer; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; font: 600 11px/1 var(--f-body); color: #fff; white-space: nowrap; letter-spacing: .01em;
  text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.55); will-change: transform; }
.lbl.sel { font-size: 14px; font-weight: 700; }
.lbl.bar { font-size: 10.5px; font-weight: 600; color: #fff8e6; }
.lbl.bar.on { font-size: 12.5px; font-weight: 700; color: #fff; }

.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .4); }

#finder { top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100% - 32px)); padding: 14px; display: grid; gap: 10px; z-index: 3; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: -.01em; }
.eyebrow { font: 500 11px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#q { width: 100%; box-sizing: border-box; font: 500 14px var(--f-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; outline: none; }
#q:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
#list { list-style: none; margin: 0; padding: 0; max-height: min(46vh, 380px); overflow-y: auto; display: grid; gap: 1px; }
#list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
#list li .code { font: 400 11px var(--f-mono); color: var(--muted); }
#list li:hover, #list li.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
#list li.cur { color: var(--accent); font-weight: 600; }

#info { top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); width: 300px; padding: 16px 16px 14px; z-index: 3; display: grid; gap: 12px; }
#info .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
#info h2 { margin: 4px 0 0; font: 700 26px/1.05 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
#close { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 16px; cursor: pointer; }
#close:hover { border-color: var(--accent); color: var(--accent); }
dl.stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
dl.stats div { min-width: 0; }
dl.stats dt { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
dl.stats dd { margin: 3px 0 0; font: 600 15px var(--f-body); font-variant-numeric: tabular-nums; }
dl.stats dd small { font-weight: 400; color: var(--muted); font-size: 12px; }
.nb-title { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
#nbs { display: flex; flex-wrap: wrap; gap: 6px; }
#nbs button { font: 500 12.5px var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
#nbs button:hover { border-color: var(--accent); color: var(--accent); }
#nbs .none { font-size: 13px; color: var(--muted); }
#bars { display: flex; flex-wrap: wrap; gap: 5px; max-height: 150px; overflow-y: auto; }
#bars button { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; cursor: pointer; }
#bars button:hover, #bars button.on { border-color: var(--accent); color: var(--accent); }
#bars .sw { width: 9px; height: 9px; border-radius: 50%; }
.bar-sel { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 12%, transparent); font: 600 14px var(--f-body); }
.bar-sel small { font: 400 11.5px var(--f-mono); color: var(--muted); }

#tools { left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; padding: 6px; display: flex; gap: 4px; align-items: center; z-index: 2; flex-wrap: wrap; max-width: calc(100% - 32px); box-sizing: border-box; }
#tools button { font: 500 12.5px var(--f-body); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
#tools button:hover { border-color: var(--line); }
#tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.exag { display: flex; align-items: center; gap: 8px; padding: 0 8px; font: 500 12.5px var(--f-body); }
.exag input { width: 90px; accent-color: var(--accent); }
.exag output { font: 500 12px var(--f-mono); color: var(--muted); min-width: 3ch; font-variant-numeric: tabular-nums; }
#coord { font: 400 11.5px var(--f-mono); color: var(--muted); padding: 0 8px; font-variant-numeric: tabular-nums; min-width: 24ch; }

#legend { right: max(16px, env(safe-area-inset-right, 0px)); bottom: 52px; padding: 12px 14px; z-index: 2; display: grid; gap: 7px; min-width: 170px; }
#legend .t { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
#legend button { display: flex; align-items: center; gap: 8px; font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 0; padding: 2px 0; cursor: pointer; text-align: left; }
#legend button span.n { margin-left: auto; font: 400 11px var(--f-mono); color: var(--muted); }
#legend button:hover { color: var(--accent); }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.reg { display: flex; align-items: center; gap: 7px; font: 500 13px var(--f-body); color: var(--muted); margin-top: 6px; }
#credit { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 1; font: 400 10.5px var(--f-mono); color: var(--muted); text-align: right; max-width: 46ch; line-height: 1.4; }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 4; font: 600 12.5px var(--f-body);
  background: var(--ink); color: var(--bg); padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
#tip small { font: 400 11px var(--f-mono); opacity: .75; margin-left: 6px; }
button:focus-visible, #list li:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 13px var(--f-mono); color: var(--muted); z-index: 5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 900px) { #credit { display: none; } }
@media (max-width: 640px) {
  #finder { right: max(16px, env(safe-area-inset-right, 0px)); width: auto; padding: 10px 12px; gap: 8px; }
  .brand h1 { font-size: 17px; }
  #list { max-height: 34vh; }
  #info { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 48vh; overflow-y: auto; gap: 10px; }
  #info h2 { font-size: 22px; }
  #tools { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #app.has-sel #tools, #app.has-sel #legend, #coord, #tip { display: none; }
  #legend { left: max(16px, env(safe-area-inset-left, 0px)); right: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); grid-template-columns: 1fr 1fr; column-gap: 14px; }
  #legend .t { grid-column: 1 / -1; }
}
</style>

<div id="app">
  <canvas id="scene" aria-label="Mapa 3D interactivo de Puerto Rico con relieve y sus 78 municipios"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="loading">Cargando relieve…</div>

  <header id="finder" class="panel">
    <div class="brand"><h1>Puerto Rico</h1><span class="eyebrow">78 municipios</span></div>
    <label for="q" class="sr">Buscar municipio</label>
    <input id="q" type="search" placeholder="Buscar municipio…" autocomplete="off" spellcheck="false">
    <ul id="list" role="listbox" aria-label="Municipios" hidden></ul>
  </header>

  <section id="info" class="panel" hidden aria-live="polite">
    <div class="head">
      <div><span class="eyebrow">Municipio · FIPS <span id="i-code"></span></span><h2 id="i-name"></h2><div class="reg"><span class="sw" id="i-regsw"></span><span id="i-reg"></span></div></div>
      <button id="close" type="button" aria-label="Cerrar ficha">✕</button>
    </div>
    <dl class="stats">
      <div><dt>Área terrestre</dt><dd id="i-area"></dd></div>
      <div><dt>Área de agua</dt><dd id="i-water"></dd></div>
      <div><dt>Altura máx. aprox.</dt><dd id="i-alt"></dd></div>
      <div><dt>Centro aprox.</dt><dd id="i-pos"></dd></div>
    </dl>
    <div class="nb-title">Colinda con</div>
    <div id="nbs"></div>
    <div class="nb-title" id="bars-title" hidden>Barrios</div>
    <div class="bar-sel" id="bar-sel" hidden><span id="bar-name"></span><small id="bar-area"></small></div>
    <div id="bars"></div>
  </section>

  <div id="tools" class="panel">
    <button id="t-labels" type="button" aria-pressed="true">Nombres</button>
    <button id="t-borders" type="button" aria-pressed="true">Límites</button>
    <button id="t-regions" type="button" aria-pressed="false">Regiones</button>
    <button id="t-spin" type="button" aria-pressed="false">Girar</button>
    <button id="t-reset" type="button">Vista inicial</button>
    <label class="exag" for="t-exag">Relieve <input id="t-exag" type="range" min="1" max="8" step="0.5" value="4"><output id="t-exag-v" for="t-exag">×4</output></label>
    <span id="coord" aria-live="off"></span>
  </div>
  <div id="legend" class="panel" hidden><span class="t">Regiones</span></div>
  <div id="credit">Límites: U.S. Census Bureau 1:500k · Relieve: DEM 30 m (USGS), render de izette1/SWCI</div>
  <div id="tip" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async () => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = Math.min(innerWidth, innerHeight) < 700;
  THREE.ColorManagement.legacyMode = false;   // colores CSS en sRGB → lineal

  // ---------- Carga de datos ----------
  const loadImg = src => new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => fail(new Error(src)); im.src = src; });
  let DATA, texImg, hmImg;
  try {
    [DATA, texImg, hmImg] = await Promise.all([fetch('data/municipios.json').then(r => r.json()), loadImg('data/relieve.webp'), loadImg('data/alturas.png')]);
  } catch (e) { $('loading').textContent = 'No se pudieron cargar los datos del mapa.'; return; }
  const byId = new Map(DATA.map((m, i) => [m.id, i]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hexRGB = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };

  // ---------- Proyección local en km ----------
  const K = 111.32, LON0 = -66.45, LAT0 = 18.22, COS = Math.cos(LAT0 * Math.PI / 180);
  const proj = (lon, lat) => [(lon - LON0) * COS * K, (lat - LAT0) * K];
  const unproj = (x, y) => [x / (COS * K) + LON0, y / K + LAT0];
  // Extensión de la textura de relieve (isla grande)
  const RB = { s: 17.878902552457824, w: -67.27256312630682, n: 18.517352656991857, e: -65.52654467314429 };
  const [TX0, TY0] = proj(RB.w, RB.s), [TX1, TY1] = proj(RB.e, RB.n);
  const TW = TX1 - TX0, TH = TY1 - TY0;
  const MAX_M = 1340;  // metros que representa el blanco del mapa de alturas

  // Mapa de alturas (km)
  const hmW = hmImg.width, hmH = hmImg.height;
  const hc = document.createElement('canvas'); hc.width = hmW; hc.height = hmH;
  const hctx = hc.getContext('2d', { willReadFrequently: true }); hctx.drawImage(hmImg, 0, 0);
  const hpx = hctx.getImageData(0, 0, hmW, hmH).data;
  const HM = new Float32Array(hmW * hmH);
  for (let i = 0; i < HM.length; i++) HM[i] = hpx[i * 4] / 255 * MAX_M / 1000;
  // Máscara de tierra (canal alfa de la textura)
  const MW = 1024, MH = Math.round(1024 * texImg.height / texImg.width);
  const mc = document.createElement('canvas'); mc.width = MW; mc.height = MH;
  const mctx = mc.getContext('2d', { willReadFrequently: true }); mctx.drawImage(texImg, 0, 0, MW, MH);
  const mpx = mctx.getImageData(0, 0, MW, MH).data;
  const landAt = (lon, lat) => {
    const u = (lon - RB.w) / (RB.e - RB.w), v = (RB.n - lat) / (RB.n - RB.s);
    if (u < 0 || u >= 1 || v < 0 || v >= 1) return false;
    return mpx[((v * MH | 0) * MW + (u * MW | 0)) * 4 + 3] > 128;
  };
  // Altura en km para coordenadas proyectadas (x, y)
  function hAt(x, y) {
    const u = (x - TX0) / TW * (hmW - 1), v = (TY1 - y) / TH * (hmH - 1);
    if (u < 0 || v < 0 || u > hmW - 1 || v > hmH - 1) return 0;
    const i = u | 0, j = v | 0, fu = u - i, fv = v - j, i1 = Math.min(i + 1, hmW - 1), j1 = Math.min(j + 1, hmH - 1);
    return (HM[j * hmW + i] * (1 - fu) + HM[j * hmW + i1] * fu) * (1 - fv) + (HM[j1 * hmW + i] * (1 - fu) + HM[j1 * hmW + i1] * fu) * fv;
  }
  const polyOnIsland = p => { const r = p[0]; let lo = 0, la = 0; r.forEach(([a, b]) => { lo += a; la += b; }); return !landAt(lo / r.length, la / r.length); };

  // ---------- Escena ----------
  const canvas = $('scene'), app = $('app');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffffff, 320, 950);
  const camera = new THREE.PerspectiveCamera(36, 1, 2, 4000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.46; controls.minDistance = 8; controls.maxDistance = 760;
  controls.screenSpacePanning = false; controls.autoRotateSpeed = 0.5; controls.zoomSpeed = 1.2;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x3a4a3e, 0.6); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4e2, 0.9);
  sun.position.set(-80, 120, -60); sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 110, bottom: -110, near: 10, far: 420 });
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.4;
  scene.add(sun);

  // ---------- Mar con aguas someras alrededor de la costa ----------
  const SEA = { w: -68.3, e: -64.9, s: 17.55, n: 18.85 };
  const [SX0, SY0] = proj(SEA.w, SEA.s), [SX1, SY1] = proj(SEA.e, SEA.n);
  const seaC = document.createElement('canvas'); seaC.width = 1024; seaC.height = Math.round(1024 * (SY1 - SY0) / (SX1 - SX0));
  const seaTex = new THREE.CanvasTexture(seaC); seaTex.encoding = THREE.sRGBEncoding;
  const seaMat = new THREE.MeshStandardMaterial({ map: seaTex, roughness: 0.5, metalness: 0.05 });
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(SX1 - SX0, SY1 - SY0), seaMat);
  sea.rotation.x = -Math.PI / 2; sea.position.set((SX0 + SX1) / 2, -0.12, -(SY0 + SY1) / 2); sea.receiveShadow = true; scene.add(sea);
  const deepMat = new THREE.MeshStandardMaterial({ roughness: 0.5 });
  const deepShape = new THREE.Shape([[-3000, -3000], [3000, -3000], [3000, 3000], [-3000, 3000]].map(p => new THREE.Vector2(...p)));
  deepShape.holes.push(new THREE.Path([[SX0, SY0], [SX0, SY1], [SX1, SY1], [SX1, SY0]].map(([x, y]) => new THREE.Vector2(x, y))));
  const deep = new THREE.Mesh(new THREE.ShapeGeometry(deepShape), deepMat);
  deep.rotation.x = -Math.PI / 2; deep.position.y = -0.12; scene.add(deep);

  function paintSea() {
    const w = seaC.width, h = seaC.height, c = seaC.getContext('2d');
    const lo = document.createElement('canvas'); lo.width = 200; lo.height = Math.round(200 * h / w);
    const sx = lo.width / w;
    const toPx = (lon, lat) => [(lon - SEA.w) / (SEA.e - SEA.w) * lo.width, (SEA.n - lat) / (SEA.n - SEA.s) * lo.height];
    const lc = lo.getContext('2d'); lc.fillStyle = '#000'; lc.fillRect(0, 0, lo.width, lo.height);
    const wm = document.createElement('canvas'); wm.width = MW; wm.height = MH;
    const wc = wm.getContext('2d'); wc.drawImage(texImg, 0, 0, MW, MH); wc.globalCompositeOperation = 'source-in'; wc.fillStyle = '#fff'; wc.fillRect(0, 0, MW, MH);
    const [ax, ay] = toPx(RB.w, RB.n), [bx, by] = toPx(RB.e, RB.s);
    lc.drawImage(wm, ax, ay, bx - ax, by - ay);
    lc.fillStyle = '#fff';
    DATA.forEach(m => m.polys.forEach(p => { if (!polyOnIsland(p)) return; lc.beginPath(); p[0].forEach(([lon, lat], k) => { const [x, y] = toPx(lon, lat); k ? lc.lineTo(x, y) : lc.moveTo(x, y); }); lc.fill(); }));
    const shrink = (src, f) => { const t = document.createElement('canvas'); t.width = Math.max(2, src.width / f | 0); t.height = Math.max(2, src.height / f | 0); const tc = t.getContext('2d'); tc.imageSmoothingQuality = 'high'; tc.drawImage(src, 0, 0, t.width, t.height); return t; };
    const b1 = shrink(lo, 2), b2 = shrink(b1, 2), b3 = shrink(b2, 2);
    const big = document.createElement('canvas'); big.width = w; big.height = h;
    const bc = big.getContext('2d', { willReadFrequently: true }); bc.imageSmoothingQuality = 'high';
    bc.drawImage(b2, 0, 0, w, h); bc.globalAlpha = 0.5; bc.drawImage(b1, 0, 0, w, h); bc.globalAlpha = 1;
    const d = bc.getImageData(0, 0, w, h), px = d.data;
    const A = hexRGB(css('--deep')), B = hexRGB(css('--shallow'));
    for (let i = 0; i < px.length; i += 4) {

  const fmtLL = ([lon, lat]) => `${lat.toFixed(3)}°N ${Math.abs(lon).toFixed(3)}°O`;
  function select(i, { fly = true } = {}) {
    if (i === selected && i !== -1) { if (fly) flyToMuni(i); return; }
    selected = i; uni.selId.value = i; paintIslands(); setSelLines(i);
    app.classList.toggle('has-sel', i >= 0);
    renderList();
    if (i < 0) { info.hidden = true; BAR.req++; clearBarrios(); dispatch(null); return; }
    const m = DATA[i];
    $('i-code').textContent = m.id; $('i-name').textContent = m.name;
    $('i-reg').textContent = 'Región ' + m.region; $('i-regsw').style.background = regColor.get(m.region);
    $('i-area').innerHTML = `${fmt.format(m.areaKm2)} km² <small>· ${fmt.format(m.areaKm2 / 2.58999)} mi²</small>`;
    $('i-water').textContent = `${fmt.format(m.aguaKm2)} km²`;
    $('i-alt').textContent = m.maxAlt == null ? 'Sin dato (isla)' : `${fmt0.format(m.maxAlt)} m`;
    $('i-pos').textContent = fmtLL(m.label);
    const nbs = $('nbs'); nbs.textContent = '';
    if (!m.nb.length) { const s = document.createElement('span'); s.className = 'none'; s.textContent = 'Isla municipio, sin colindancias terrestres.'; nbs.append(s); }
    m.nb.map(id => byId.get(id)).sort((a, b) => a - b).forEach(j => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = DATA[j].name;
      b.addEventListener('click', () => select(j));
      b.addEventListener('mouseenter', () => setHover(j)); b.addEventListener('mouseleave', () => setHover(-1));
      nbs.append(b);
    });
    info.hidden = false;
    showBarrios(i);
    if (fly) flyToMuni(i);
    dispatch(m);
  }
  function dispatch(m) { window.dispatchEvent(new CustomEvent('municipio:select', { detail: m ? { id: m.id, name: m.name } : null })); }
  function setHover(i) {
    if (i === hovered) return;
    hovered = i; uni.hovId.value = i; paintIslands();
    canvas.classList.toggle('hovering', i >= 0);
  }

  // ---------- Puntero: rayo contra el relieve (marcha sobre el mapa de alturas) e islas ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), P = new THREE.Vector3();
  function idAtXY(x, y) {
    const [lon, lat] = unproj(x, y);
    const u = (lon - RB.w) / (RB.e - RB.w), v = (RB.n - lat) / (RB.n - RB.s);
    if (u < 0 || u >= 1 || v < 0 || v >= 1 || !landAt(lon, lat)) return -1;
    return idPx[((v * IH | 0) * IW + (u * IW | 0)) * 4] - 1;
  }
  const below = t => { P.copy(ray.ray.direction).multiplyScalar(t).add(ray.ray.origin); return P.y <= hAt(P.x, -P.z) * EX; };
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    let best = { idx: -1, t: Infinity, x: 0, y: 0 };
    const isl = ray.intersectObjects(islandMeshes, false)[0];
    if (isl) best = { idx: isl.object.userData.idx, t: isl.distance, x: isl.point.x, y: -isl.point.z };
    if (d.y < 0) {
      const top = 1.4 * EX + 0.1, t0 = Math.max(0, (o.y - top) / -d.y), t1 = o.y / -d.y, N = 240;
      let hitT = t1, prev = t0;
      for (let k = 1; k <= N; k++) {
        const t = t0 + (t1 - t0) * k / N;
        if (below(t)) { let a = prev, b = t; for (let s = 0; s < 14; s++) { const md = (a + b) / 2; if (below(md)) b = md; else a = md; } hitT = b; break; }
        prev = t;
      }
      P.copy(d).multiplyScalar(hitT).add(o);
      if (hitT < best.t) best = { idx: idAtXY(P.x, -P.z), t: hitT, x: P.x, y: -P.z };
    }
    return { ...best, r };
  }
  const tip = $('tip'), coord = $('coord');
  let down = null;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || down) return;
    const p = pick(e);
    setHover(p.idx);
    const bk = p.idx >= 0 && p.idx === selected && BAR.list.length ? barrioAt(...unproj(p.x, p.y)) : -1;
    setHoverBar(bk);
    const onMain = p.idx >= 0 && landAt(...unproj(p.x, p.y));
    const h = onMain ? Math.round(hAt(p.x, p.y) * 1000) : null;
    if (p.idx >= 0) {
      tip.hidden = false; tip.textContent = bk >= 0 ? `${barName(BAR.list[bk])} · ${DATA[p.idx].name}` : DATA[p.idx].name;
      if (h != null) { const s = document.createElement('small'); s.textContent = `${fmt0.format(h)} m`; tip.append(s); }
      tip.style.transform = `translate(${e.clientX - p.r.left + 14}px,${e.clientY - p.r.top + 14}px)`;
    } else tip.hidden = true;
    if (isFinite(p.t)) coord.textContent = fmtLL(unproj(p.x, p.y)) + (h != null ? ` · ${fmt0.format(h)} m` : '');
  });
  canvas.addEventListener('pointerleave', () => { setHover(-1); setHoverBar(-1); tip.hidden = true; });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 6) return;
    const p = pick(e);
    if (p.idx >= 0 && p.idx === selected && BAR.list.length) { const k = barrioAt(...unproj(p.x, p.y)); if (k >= 0) { selectBarrio(k); return; } }
    if (p.idx >= 0) select(p.idx); else if (selected >= 0) select(-1);
  });
  controls.addEventListener('start', () => { tween = null; tip.hidden = true; });

  // ---------- Buscador ----------
  const q = $('q'), listEl = $('list');
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let matches = [], active = 0;
  function renderList() {
    const s = norm(q.value.trim()), open = document.activeElement === q || s.length > 0;
    matches = DATA.map((m, i) => i).filter(i => !s || norm(DATA[i].name).includes(s));
    listEl.hidden = !open; if (!open) return;
    active = Math.min(active, Math.max(0, matches.length - 1));
    listEl.textContent = '';
    if (!matches.length) { const li = document.createElement('li'); li.textContent = 'Ningún municipio coincide'; li.style.cursor = 'default'; listEl.append(li); return; }
    matches.forEach((i, k) => {
      const li = document.createElement('li'); li.setAttribute('role', 'option');
      if (k === active && s) li.classList.add('active');
      if (i === selected) li.classList.add('cur');
      const n = document.createElement('span'); n.textContent = DATA[i].name;
      const c = document.createElement('span'); c.className = 'code'; c.textContent = DATA[i].id;
      li.append(n, c);
      li.addEventListener('mousedown', ev => { ev.preventDefault(); choose(i); });
      li.addEventListener('mouseenter', () => setHover(i)); li.addEventListener('mouseleave', () => setHover(-1));
      listEl.append(li);
    });
  }
  function choose(i) { select(i); q.value = ''; q.blur(); renderList(); }
  q.addEventListener('input', () => { active = 0; renderList(); });
  q.addEventListener('focus', renderList);
  q.addEventListener('blur', () => setTimeout(renderList, 0));
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { active = Math.min(active + 1, matches.length - 1); renderList(); e.preventDefault(); listEl.querySelector('.active')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderList(); e.preventDefault(); listEl.querySelector('.active')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter' && matches.length) choose(matches[active]);
    else if (e.key === 'Escape') { q.value = ''; q.blur(); }
  });
  $('close').addEventListener('click', () => select(-1));
  addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement !== q && selected >= 0) select(-1); });

  // ---------- Herramientas ----------
  const toggle = (id, fn) => { const b = $(id); b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }); };
  toggle('t-labels', on => { showLabels = on; });
  toggle('t-borders', on => { borderMain.visible = borderIsl.visible = on; });
  toggle('t-spin', on => { controls.autoRotate = on; });
  const legend = $('legend');
  REGIONS.forEach(([n, c]) => {
    const b = document.createElement('button'); b.type = 'button';
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = c;
    const cnt = document.createElement('span'); cnt.className = 'n'; cnt.textContent = DATA.filter(m => m.region === n).length;
    b.append(sw, n, cnt);
    b.addEventListener('click', () => flyToRegion(n));
    legend.append(b);
  });
  function flyToRegion(n) {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    muni.forEach(o => { if (o.m.region !== n || o.isl) return; x0 = Math.min(x0, o.lx); x1 = Math.max(x1, o.lx); y0 = Math.min(y0, o.ly); y1 = Math.max(y1, o.ly); });
    if (x0 > x1) return;
    select(-1, { fly: false });
    const c = new THREE.Vector3((x0 + x1) / 2, 0, -(y0 + y1) / 2), span = Math.max(x1 - x0, (y1 - y0) * 1.6, 25);
    const d = span * 1.35 * Math.max(1, 0.85 * size.h / size.w);
    flyTo(c, c.clone().add(new THREE.Vector3(0, 0.74, 0.67).normalize().multiplyScalar(d)));
  }
  toggle('t-regions', on => { regionsOn = on; uni.regionOn.value = on ? 1 : 0; legend.hidden = !on; paintIslands(); });
  $('t-reset').addEventListener('click', () => { select(-1, { fly: false }); const v = homeView(); flyTo(v.target, v.pos); });
  $('t-exag').addEventListener('input', e => setExag(+e.target.value));

  // ---------- Bucle ----------
  function resize() {
    const w = app.clientWidth, h = app.clientHeight; if (!w || !h) return;
    size = { w, h }; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(app); resize();
  applyTheme();
  const v0 = homeView();
  controls.target.copy(v0.target);
  if (reduceMotion) camera.position.copy(v0.pos);
  else { camera.position.set(-40, 26, 70); controls.target.set(-20, 0, 0); flyTo(v0.target, v0.pos, 2600); setTimeout(() => { labelsReady = true; }, 2300); }

  function frame() {
    if (tween) {
      const k = tween.ms ? Math.min(1, (performance.now() - tween.t0) / tween.ms) : 1, e = ease(k);
      controls.target.lerpVectors(tween.ft, tween.tt, e); camera.position.lerpVectors(tween.fp, tween.tp, e);
      if (k >= 1) tween = null;
    }
    controls.update();
    renderer.render(scene, camera);
    placeLabels(size.w, size.h);
    requestAnimationFrame(frame);
  }
  $('loading').remove();
  requestAnimationFrame(frame);
  renderList();

  // API para la app: PRMap.select('Ponce'), PRMap.clear(), PRMap.reset(), PRMap.heightAt(lon, lat), PRMap.data
  window.PRMap = {
    data: DATA,
    select(key) { const i = typeof key === 'number' ? key : DATA.findIndex(m => m.id === key || norm(m.name) === norm(String(key))); if (i >= 0) select(i); return i; },
    clear() { select(-1); },
    selectBarrio(name) { const k = BAR.list.findIndex(b => norm(b.name) === norm(String(name)) || b.id === name); if (k >= 0) selectBarrio(k, { fly: true }); return k; },
    get barrios() { return BAR.list.map(b => ({ id: b.id, name: b.name, pueblo: b.pueblo, areaKm2: b.areaKm2, color: b.color })); },
    reset() { $('t-reset').click(); },
    regions: REGIONS.map(([name, color]) => ({ name, color, municipios: DATA.filter(m => m.region === name).map(m => m.name) })),
    showRegions(on = true) { if ((($('t-regions').getAttribute('aria-pressed') === 'true')) !== on) $('t-regions').click(); },
    heightAt(lon, lat) { return Math.round(hAt(...proj(lon, lat)) * 1000); },
  };
})();
</script>
